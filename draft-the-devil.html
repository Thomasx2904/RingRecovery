function drawHound(e){ctx.save();ctx.translate(e.x,e.y);circle(0,7,16,'#0005');ctx.rotate(e.wind>0?e.lock:e.angle);const col=e.flash>0?'#fff2d4':'#bea5b0';polygon([[-17,-9],[-11,-5],[-17,8],[-7,6],[0,10],[12,6],[18,0],[12,-6],[0,-10],[-7,-6]],col,'#ded0c4',.8);polygon([[3,-7],[11,-4],[6,-2]],'#71394b');polygon([[3,7],[11,4],[6,2]],'#71394b');ctx.fillStyle='#453440';ctx.fillRect(9,-2,8,4);ctx.strokeStyle='#6d5362';ctx.lineWidth=1.5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-9+i*4,-4);ctx.lineTo(-9+i*4,4);ctx.stroke();}ctx.restore();}
function drawDevil(x,y,size=1,clone=false,flash=false){ctx.save();ctx.translate(x,y);ctx.scale(size,size);circle(0,16,31,'#0005');const bob=Math.sin(now*2)*2;ctx.translate(0,bob);const col=clone?'#8966ac':'#b85058';const edge=clone?'#d0a1f5':'#f3937c';if(!clone){if(evil.includes('fire'))glow(0,5,70,'#f05d3722');if(evil.includes('blood')){ctx.strokeStyle='#d1587144';ctx.lineWidth=2;for(let i=0;i<4;i++){const a=now*1.3+i*Math.PI/2;ctx.beginPath();ctx.arc(0,0,35+Math.sin(now+i)*3,a,a+.5);ctx.stroke();}}if(evil.includes('chain')){ctx.strokeStyle='#a8c9ff';ctx.globalAlpha=.55+Math.sin(now*7)*.2;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-32,-10);ctx.lineTo(-41,-17);ctx.lineTo(-36,-23);ctx.moveTo(32,-10);ctx.lineTo(41,-17);ctx.lineTo(36,-23);ctx.stroke();ctx.globalAlpha=1;}if(evil.includes('ricochet')){for(let i=0;i<3;i++){const a=-now+i*TAU/3;circle(Math.cos(a)*41,Math.sin(a)*29,2.4,'#e8d594');}}}
 polygon([[-19,-3],[-28,23],[-16,18],[-12,29],[0,22],[12,29],[16,18],[28,23],[19,-3]],clone?'#48344e':'#502435',edge,.8);polygon([[-14,-19],[-26,-30],[-24,-43],[-17,-32],[-6,-26]],flash?'#fff':col,edge,1.1);polygon([[14,-19],[26,-30],[24,-43],[17,-32],[6,-26]],flash?'#fff':col,edge,1.1);polygon([[-16,-22],[0,-27],[16,-22],[22,-8],[17,12],[0,27],[-17,12],[-22,-8]],flash?'#ffebcc':col,edge,1.2);polygon([[-15,-10],[-4,-5],[-10,0]],'#ffd8b5');polygon([[15,-10],[4,-5],[10,0]],'#ffd8b5');polygon([[0,-7],[-4,9],[4,9]],clone?'#604468':'#713042');ctx.strokeStyle='#ffe1b4';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-8,13);ctx.lineTo(0,18);ctx.lineTo(8,13);ctx.stroke();ctx.strokeStyle='#edc7b3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,14);ctx.lineTo(-4,20);ctx.moveTo(6,14);ctx.lineTo(4,20);ctx.stroke();ctx.restore();}
function drawEnemy(e){if(e.spawn>0){ctx.globalAlpha=.4;circle(e.x,e.y,17+(Math.sin(now*9)*2),null,e.type==='clone'?'#d4a1fa':'#ef8675',1.2);circle(e.x,e.y,7,'#b74e5844');ctx.globalAlpha=1-e.spawn/.85;}if(e.type==='hound')drawHound(e);else if(e.type==='shooter')drawShooter(e);else if(e.type==='clone')drawDevil(e.x,e.y,.62,true,e.flash>0);else drawImp(e);ctx.globalAlpha=1;if(e.hp<e.max&&e.hp>0&&e.spawn<=0){ctx.fillStyle='#150f1bbd';ctx.fillRect(e.x-13,e.y-23,26,3);ctx.fillStyle=e.type==='clone'?'#d2a8f1':'#f59f91';ctx.fillRect(e.x-13,e.y-23,26*clamp(e.hp/e.max,0,1),3);}}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#171321';ctx.fillRect(0,0,canvas.width,canvas.height);if(floor)ctx.drawImage(floor,0,0);ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 // Small animated flames make the otherwise cached arena feel alive.
 for(const [x,y]of[[17,H*.24],[W-17,H*.24],[17,H*.75],[W-17,H*.75]]){glow(x,y,32,'#e46f3020');ctx.fillStyle='#483541';ctx.fillRect(x-4,y+2,8,10);polygon([[x-5,y+2],[x-3,y-5],[x+Math.sin(now*7+x)*2,y-12],[x+4,y-3],[x+5,y+3]],'#d48b61');polygon([[x-2,y+2],[x,y-7],[x+2,y+2]],'#f2c17e');}
 if(mode==='menu'){drawDevil(W/2,H*.42,1.35);ctx.restore();return;}
 // Ground warnings are drawn before actors and projectiles.
 for(const h of hazards){const col=h.type==='lightning'?'#aec9ff':'#ffb176';if(h.delay>0){const f=1-h.delay/h.fullDelay;circle(h.x,h.y,h.r,null,col+'9c',1.4);circle(h.x,h.y,h.r*f,col+'16');ctx.save();ctx.setLineDash([3,5]);circle(h.x,h.y,h.r+3,null,col+'65');ctx.restore();ctx.strokeStyle=col+'aa';ctx.beginPath();ctx.moveTo(h.x-5,h.y);ctx.lineTo(h.x+5,h.y);ctx.moveTo(h.x,h.y-5);ctx.lineTo(h.x,h.y+5);ctx.stroke();}else{glow(h.x,h.y,h.r*1.4,col+'39');circle(h.x,h.y,h.r,col+'35',col+'aa',1);if(h.type==='lightning'){ctx.strokeStyle='#e2ebff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(h.x-8,h.y-h.r-38);ctx.lineTo(h.x+6,h.y-15);ctx.lineTo(h.x-7,h.y);ctx.lineTo(h.x+2,h.y+12);ctx.stroke();}else{for(let i=0;i<8;i++){const a=i*TAU/8+now;circle(h.x+Math.cos(a)*h.r*.65,h.y+Math.sin(a)*h.r*.65,2+Math.sin(now*10+i),'#ffcb8b');}}}}
 for(const e of enemies)if(e.type==='hound'&&e.wind>0){ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle='#ffbc8888';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(e.lock)*140,e.y+Math.sin(e.lock)*140);ctx.stroke();ctx.restore();}
 if(B&&(mode==='boss'||mode==='bossIntro'||mode==='paused')){if(B.cast>0){const rad=1-B.cast/.62;circle(B.x,B.y,35+rad*12,null,'#ffab8399',1.4);ctx.strokeStyle='#ffad7555';ctx.lineWidth=1.2;for(const off of [-.22,0,.22]){ctx.beginPath();ctx.moveTo(B.x+Math.cos(B.target+off)*36,B.y+Math.sin(B.target+off)*36);ctx.lineTo(B.x+Math.cos(B.target+off)*110,B.y+Math.sin(B.target+off)*110);ctx.stroke();}}drawDevil(B.x,B.y,1,false,B.flash>0);if(evil.includes('halo')){circle(B.x,B.y,53,null,'#bde0ac22');for(let i=0;i<3;i++){const a=totalTime*1.9+i*TAU/3;drawBlade(B.x+Math.cos(a)*53,B.y+Math.sin(a)*53,a,'#badca8');}}}
 for(const p of pickups){glow(p.x,p.y,13,'#b9e1b526');ctx.save();ctx.translate(p.x,p.y+Math.sin(now*5)*2);ctx.rotate(Math.PI/4);ctx.fillStyle='#b8dca9';ctx.fillRect(-3,-3,6,6);ctx.restore();}
 enemies.sort((a,b)=>a.y-b.y);for(const e of enemies)drawEnemy(e);drawPlayer();
 for(const b of bullets){ctx.strokeStyle=b.color+'69';ctx.lineWidth=b.r*1.5;ctx.beginPath();ctx.moveTo(b.x-b.vx*.027,b.y-b.vy*.027);ctx.lineTo(b.x,b.y);ctx.stroke();if(b.team==='enemy'){circle(b.x,b.y,b.r+1.3,'#421d30');circle(b.x,b.y,b.r,b.color);circle(b.x-1,b.y-1,b.r*.43,'#ffe4c7');}else{circle(b.x,b.y,b.r,b.color);circle(b.x,b.y,1.5,'#f0fff7');}}
 for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}ctx.globalAlpha=1;
 for(const f of fx){const alpha=clamp(f.life/f.max,0,1);ctx.globalAlpha=alpha;if(f.type==='ring'){circle(f.x,f.y,f.r*(1-alpha*.7),null,f.color,1.5);}else if(f.type==='text'){ctx.font='600 12px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.str,f.x,f.y-(1-alpha)*24);}else if(f.type==='lightning'){ctx.strokeStyle=f.color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x,f.y);for(let i=1;i<6;i++){const t=i/6;ctx.lineTo(f.x+(f.x2-f.x)*t+(Math.random()-.5)*15,f.y+(f.y2-f.y)*t+(Math.random()-.5)*15);}ctx.lineTo(f.x2,f.y2);ctx.stroke();}}ctx.globalAlpha=1;if(hitFlash>0){ctx.fillStyle=`rgba(255,55,68,${hitFlash*.6})`;ctx.fillRect(0,0,W,H);}ctx.restore();}
function frame(ms){const dt=last?Math.min((ms-last)/1000,.034):.016;last=ms;now=ms/1000;if(active())update(dt);if(mode!=='paused'){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;}particles=particles.filter(p=>p.life>0);for(const f of fx)f.life-=dt;fx=fx.filter(f=>f.life>0);shake=Math.max(0,shake-dt*35);hitFlash=Math.max(0,hitFlash-dt);}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('on');}if(tutorialTimer>0){tutorialTimer-=dt;if(tutorialTimer<=0)$('tutorial').classList.remove('on');}hudClock+=dt;if(hudClock>.1){hudClock=0;updateHUD();}render();requestAnimationFrame(frame);}
// The read-only state is useful for regression tests; gameplay has no remote backend.
Object.defineProperty(window,'__DTD_STATE__',{get:()=>({mode,seed,my:my.slice(),evil:evil.slice(),draftIndex,wave,waveTime,totalTime,kills,hitsTaken,hp:P?.hp,player:P?{x:P.x,y:P.y,dash:P.dash,dashCD:P.dashCD}:null,boss:B?{hp:B.hp,max:B.max,x:B.x,y:B.y}:null,enemies:enemies.length,projectiles:bullets.length,hazards:hazards.length,W,H})});
resize();title();requestAnimationFrame(frame);
})();
